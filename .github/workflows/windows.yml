name: Windows player

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Restore pinned media runtime
        shell: pwsh
        run: ./scripts/setup-media.ps1
      - run: npm ci
      - run: npm run test:unit
      - name: Build Windows installer and check types
        run: npm run dist:win -- --publish never
      - name: Verify packaged resources
        run: node scripts/check-package.ts
      - run: npm run test:integration
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MusicWorkbench-Windows-x64
          path: |
            release/MusicWorkbench-*-Setup.exe
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
